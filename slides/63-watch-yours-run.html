<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch yours run · Hire Your First AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.rows { flex:1; display:grid; align-content:center; gap: 6px; margin-top: 30px; max-width: 1500px; }
.ln { display:grid; grid-template-columns: 260px 1fr; align-items:end; padding: 20px 0; }
.ln b { font-family: var(--mono); font-size: 28px; letter-spacing: .1em; color: var(--neon); font-weight: 600; }
.blank { height: 56px; border-bottom: 2px solid rgba(242,251,247,.25); display:flex; align-items:center; }
.caret { display:inline-block; width: 4px; height: 44px; background: var(--neon); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body class="dark" data-section="Workshop" data-sparks="9,1 1,5" style="--gx:80%;--gy:40%;--mx:80%;--my:40%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">Let’s set one up, live</h1>
<div class="rows"><div class="ln r" style="--d:0.40s"><b>WHEN</b><span class="blank"><i class="caret"></i></span></div><div class="ln r" style="--d:0.52s"><b>LOOK AT</b><span class="blank"></span></div><div class="ln r" style="--d:0.64s"><b>DO</b><span class="blank"></span></div><div class="ln r" style="--d:0.76s"><b>UNLESS</b><span class="blank"></span></div><div class="ln r" style="--d:0.88s"><b>STOP WHEN</b><span class="blank"></span></div><div class="ln r" style="--d:1.00s"><b>TELL</b><span class="blank"></span></div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
