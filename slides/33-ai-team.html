<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The AI team · Hire Your First AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.team { display:flex; flex-wrap:wrap; gap: 24px; justify-content:center; margin-top: 36px; }
.m { width: 396px; padding: 30px 34px 32px; display:flex; flex-direction:column; align-items:flex-start; }
.m .av { width: 128px; height: 128px; margin-bottom: 22px; }
.m b { font-size: 36px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.m span { font-size: 28px; color: var(--ink-2); line-height: 1.25; margin-top: 4px; }
.end { margin-top: auto; text-align:center; font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
.end span { color: var(--ink-3); font-weight: 500; }
</style>
</head>
<body class="light" data-section="SuDu AI" data-sparks="9,1 1,5" style="--gx:50%;--gy:60%;--mx:50%;--my:60%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">7 agents, each with 1 job</h1>
<div class="team"><div class="glass m pop" style="--d:0.35s"><img class="av" src="../assets/av/agent-typing.svg" alt=""><b>Sales AI</b><span>takes orders</span></div><div class="glass m pop" style="--d:0.47s"><img class="av" src="../assets/av/av-agent-clip.png" alt=""><b>Purchase AI</b><span>buys stock</span></div><div class="glass m pop" style="--d:0.59s"><img class="av" src="../assets/av/agent-bullseye.svg" alt=""><b>Inventory AI</b><span>watches stock</span></div><div class="glass m pop" style="--d:0.71s"><img class="av" src="../assets/av/agent-payday.svg" alt=""><b>Collection AI</b><span>collects payments</span></div><div class="glass m pop" style="--d:0.83s"><img class="av" src="../assets/av/av-agent-invoice.png" alt=""><b>Payment AI</b><span>pays suppliers</span></div><div class="glass m pop" style="--d:0.95s"><img class="av" src="../assets/av/av-agent-mega.png" alt=""><b>Up Sales AI</b><span>brings customers back</span></div><div class="glass m pop" style="--d:1.07s"><img class="av" src="../assets/av/av-agent-chart.png" alt=""><b>Finance AI</b><span>tracks the numbers</span></div></div>
<p class="end r" style="--d:1.4s">Normal cases run on their own. <span>Special cases go to a manager.</span></p>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
