<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>建立你的第一个 AI 工作 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.top { display:flex; justify-content:space-between; align-items:flex-start; }
.wrap { flex:1; display:grid; grid-template-columns: 470px 1fr; gap: 48px; margin-top: 34px; }
.pick h3, .tab h3 { font-size: 24px; color: var(--ink-3); font-weight: 500; margin-bottom: 14px; }
.pick ul { list-style:none; display:grid; gap: 8px; }
.pick li { font-size: 26px; padding: 9px 18px; border-radius: 12px; color: var(--ink-2); }
.pick li.on { background: var(--ink); color: var(--on-dark); font-weight: 600; }
.tab { padding: 34px 44px; }
.ln { display:grid; grid-template-columns: 210px 1fr; align-items:center; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 31px; line-height: 1.3; }
.ln:last-child { border: 0; }
.ln b { font-family: var(--mono); font-size: 22px; letter-spacing: .1em; color: var(--green); font-weight: 600; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="工作坊" data-sparks="9,5" style="--gx:80%;--gy:60%;--mx:80%;--my:60%">
<main class="slide">
<div class="top"><h1 class="h1 r" style="--d:.1s">像教新文员一样写下来</h1><div class="ws r" style="--d:2.2s"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><b>第 3 格</b>6 行</div></div>
<div class="wrap">
  <div class="pick"><h3 class="f" style="--d:.2s">选一个：</h3><ul><li class=" r" style="--d:0.30s">接 WhatsApp 订单</li><li class=" r" style="--d:0.36s">发 Invoice</li><li class="on r" style="--d:0.42s">追逾期客户</li><li class=" r" style="--d:0.48s">记录银行单据</li><li class=" r" style="--d:0.54s">每天早上查库存</li><li class=" r" style="--d:0.60s">补货</li><li class=" r" style="--d:0.66s">回答“bila nak bayar?”</li><li class=" r" style="--d:0.72s">输入供应商 Invoice</li><li class=" r" style="--d:0.78s">提醒流失的客户</li><li class=" r" style="--d:0.84s">发促销</li></ul></div>
  <div class="glass tab r" style="--d:.8s"><h3>例子：追逾期客户</h3><div class="ln r" style="--d:1.00s"><b>何时</b><span>每个工作日早上 9 点</span></div><div class="ln r" style="--d:1.15s"><b>看什么</b><span>逾期超过 30 天的 Invoice</span></div><div class="ln r" style="--d:1.30s"><b>做什么</b><span>附上对账单，礼貌提醒</span></div><div class="ln r" style="--d:1.45s"><b>除非</b><span>客户已承诺日期，或标明“不要追”</span></div><div class="ln r" style="--d:1.60s"><b>何时停</b><span>钱进了银行</span></div><div class="ln r" style="--d:1.75s"><b>通知谁</b><span>收到单据时通知 Mei Ling</span></div></div>
</div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
