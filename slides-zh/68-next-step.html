<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>你的下一步 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.cards { flex:1; display:grid; grid-template-columns: 1.45fr 1fr; gap: 32px; margin-top: 46px; }
.big { background: var(--ink); color: var(--on-dark); border-radius: 34px; padding: 52px 56px; display:flex; flex-direction:column; box-shadow: 0 0 120px rgba(0,245,169,.22); position:relative; overflow:hidden; }
.big h3 { font-size: 54px; font-weight: 650; letter-spacing: -.03em; line-height: 1.08; }
.big h3 span { color: var(--neon); }
.big p { font-size: 32px; line-height: 1.42; color: var(--on-dark-2); margin-top: 26px; max-width: 820px; }
.big .av { position:absolute; right: 44px; bottom: 40px; width: 200px; height: 200px; }
.sm { padding: 52px 50px; display:flex; flex-direction:column; } .sm p:last-child { margin-top: auto; padding-top: 30px; border-top: 1px solid var(--line); }
.sm h3 { font-size: 40px; font-weight: 650; letter-spacing: -.02em; }
.sm p { font-size: 30px; line-height: 1.42; color: var(--ink-2); margin-top: 22px; }
.band { margin-top: 32px; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="诊断" data-sparks="9,1 1,5" style="--gx:35%;--gy:55%;--mx:40%;--my:55%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">预约免费的 AI 流程评估</h1>
<div class="cards">
  <div class="big r" style="--d:.3s"><h3><span>免费，45 分钟，</span><br>在你的办公室。</h3><p>我们从你的分数和第一个 AI 工作出发，用你自己的数据现场跑给你看，再推荐 1 个配套。</p><img class="av pop" style="--d:1s" src="../assets/av/agent-thumbs.svg" alt=""></div>
  <div class="glass sm r" style="--d:.5s"><h3>现在就想开始？</h3><p>14 天内签约： <span class="ph">[优惠]</span>.</p><p>我们每月只接 <span class="ph">[N]</span> 家新公司。</p></div>
</div>
<div class="band"><div class="ws r" style="--d:1.2s"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><b>第 4 格</b>把作业纸交给你的桌长。</div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
