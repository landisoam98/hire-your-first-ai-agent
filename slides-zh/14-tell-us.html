<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>说说你的问题 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.wrap { display:grid; grid-template-columns: 460px 1fr; gap: 130px; align-items:center; height:100%; }
ol { list-style:none; margin-top: 56px; display:grid; gap: 34px; counter-reset: q; }
li { display:grid; grid-template-columns: 76px 1fr; align-items:baseline; font-size: 40px; line-height: 1.25; font-weight: 500; letter-spacing: -.01em; counter-increment: q; }
li::before { content: counter(q); font-family: var(--mono); font-size: 28px; color: var(--green); }
.small { margin-top: 52px; padding-left: 76px; font-size: 28px; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="问题" data-sparks="2,1 8,4" style="--gx:22%;--gy:50%;--mx:25%">
<main class="slide">
<div class="wrap">
  <div class="qr glass pop" style="--d:.2s"><div class="frame"></div><div class="scan"></div><div class="ql"><b>二维码</b>问题调查<br>[待加链接]</div></div>
  <div>
    <h1 class="h1 r" style="--d:.1s">扫码回答 3 个问题</h1>
    <ol>
      <li class="r" style="--d:.5s">你办公室里哪项工作最花时间？</li>
      <li class="r" style="--d:.65s">有几个人在输入数据或追款？</li>
      <li class="r" style="--d:.8s">你有多信任你的库存数字？</li>
    </ol>
    <p class="small r" style="--d:1.1s">只需 1 分钟。</p>
  </div>
</div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
