<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>AI 准备度检查 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.top { display:flex; justify-content:space-between; align-items:flex-start; }
.sub { font-size: 32px; color: var(--ink-2); margin-top: 14px; }
.grid { flex:1; display:grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: repeat(4, 1fr); column-gap: 64px; margin-top: 30px; }
.q { display:grid; grid-template-columns: 52px 46px 1fr; align-items:center; gap: 8px; font-size: 31px; line-height: 1.25; border-bottom: 1px solid var(--line); }
.q i { width: 36px; height: 36px; border: 3px solid var(--ink); border-radius: 8px; background:#fff; }
.q .n { font-family: var(--mono); font-size: 24px; color: var(--green); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="工作坊" data-sparks="9,1" style="--gx:90%;--gy:10%;--mx:90%;--my:10%">
<main class="slide">
<div class="top"><div><h1 class="h1 r" style="--d:.1s">你的公司准备好用 AI 了吗？</h1><p class="sub r" style="--d:.25s">每个“是”得 1 分。</p></div><div class="ws r" style="--d:1.3s"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><b>第 2 格</b>满分 8 分</div></div>
<div class="grid"><div class="q r" style="--d:0.40s"><i></i><span class="n">1</span><span>每个货品是不是只有 1 个编号？</span></div><div class="q r" style="--d:0.50s"><i></i><span class="n">2</span><span>每个货品的单位固定吗：箱、件还是 kg？</span></div><div class="q r" style="--d:0.60s"><i></i><span class="n">3</span><span>盘点时，系统里的库存和货架对得上吗？</span></div><div class="q r" style="--d:0.70s"><i></i><span class="n">4</span><span>订单是进到 1 个地方，而不是散在 5 部手机？</span></div><div class="q r" style="--d:0.80s"><i></i><span class="n">5</span><span>每个客户在 SQL Account 里都有信用额度和付款期限吗？</span></div><div class="q r" style="--d:0.90s"><i></i><span class="n">6</span><span>系统里的价格表是最新的吗？</span></div><div class="q r" style="--d:1.00s"><i></i><span class="n">7</span><span>谁批准折扣、赊账和采购，有写清楚吗？</span></div><div class="q r" style="--d:1.10s"><i></i><span class="n">8</span><span>客户和供应商的电话都存在系统里吗？</span></div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
