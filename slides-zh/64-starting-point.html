<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>你的起点 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.cols { flex:1; display:grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 50px; }
.c { padding: 40px 42px; display:flex; flex-direction:column; border-radius: 30px; }
.hd { display:flex; align-items:center; justify-content:space-between; }
.hd svg { width: 110px; height: 96px; }
.sc { font-family: var(--mono); font-size: 40px; font-weight: 600; color: var(--green); }
.c h3 { font-size: 42px; font-weight: 650; letter-spacing: -.02em; margin-top: 30px; }
.c p { font-size: 30px; line-height: 1.38; color: var(--ink-2); margin-top: 12px; }
.m { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--line); font-size: 28px; line-height: 1.35; }
.m b { display:block; font-family: var(--mono); font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; }
.c-on { background: var(--ink); color: var(--on-dark); box-shadow: 0 0 90px rgba(0,245,169,.22); }
.c-on p { color: var(--on-dark-2); } .c-on .sc, .c-on .m b { color: var(--neon); } .c-on .m { border-color: rgba(242,251,247,.15); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="诊断" data-sparks="9,1 1,5" style="--gx:50%;--gy:55%;--mx:50%;--my:55%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">按分数，3 种开始方式</h1>
<div class="cols"><div class="glass c r" style="--d:0.30s"><div class="hd"><svg viewBox="0 0 120 104" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 86h104v12H8z" fill="#00F5A9" fill-opacity=".35"/><path d="M8 86h104v12H8z"/><path d="M20 86V50h80v36" stroke-dasharray="3 7" opacity=".35"/><path d="M12 52L60 18l48 34" stroke-dasharray="3 7" opacity=".35"/></svg><span class="sc">0 到 3</span></div><h3>先打地基。</h3><p>WMS，有生产的话加 MES。</p><div class="m"><b>第一个月</b>货品编号整理好，库存扫码入账。</div></div><div class="c-on c r" style="--d:0.50s"><div class="hd"><svg viewBox="0 0 120 104" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 86h104v12H8z" fill="#00F5A9" fill-opacity=".35"/><path d="M8 86h104v12H8z"/><path d="M20 86V50h80v36M52 86V64h16v22"/><path d="M12 52L60 18l48 34" stroke-dasharray="3 7" opacity=".35"/></svg><span class="sc">4 到 6</span></div><h3>先用 AI Agent。</h3><p>直接用你的 SQL Account 数据。</p><div class="m"><b>第一个月</b>1 个工作每天在跑。</div></div><div class="glass c r" style="--d:0.70s"><div class="hd"><svg viewBox="0 0 120 104" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 86h104v12H8z" fill="#00F5A9" fill-opacity=".35"/><path d="M8 86h104v12H8z"/><path d="M20 86V50h80v36M52 86V64h16v22"/><path d="M12 52L60 18l48 34" stroke-width="5"/><circle cx="60" cy="12" r="7" fill="#00F5A9" stroke="none"/></svg><span class="sc">7 到 8</span></div><h3>整套系统。</h3><p>AI Agent、WMS 和 MES 一起上。</p><div class="m"><b>第一个月</b>订单、库存和付款全连通。</div></div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
