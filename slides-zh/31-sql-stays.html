<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>SQL Account 照用 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.h1 { max-width: 1664px; }
.flow { display:grid; grid-template-columns: 1fr 80px 1fr 80px 1fr; gap: 18px; align-items:stretch; margin-top: 56px; }
.c { padding: 40px 42px; border-radius: 30px; }
.c h3 { font-size: 34px; font-weight: 650; letter-spacing: -.015em; margin-bottom: 26px; display:flex; align-items:center; gap: 14px; }
.c ul { list-style:none; display:grid; gap: 16px; }
.c li { font-size: 32px; color: var(--ink-2); padding-left: 26px; position:relative; }
.c li::before { content:""; position:absolute; left:0; top: .58em; width: 9px; height: 9px; border-radius: 50%; background: var(--emerald); }
.mid { background: var(--ink); color: var(--on-dark); box-shadow: 0 40px 80px -40px rgba(2,34,31,.6), 0 0 80px rgba(0,245,169,.18); }
.mid li { color: var(--on-dark-2); } .mid li::before { background: var(--neon); }
.arr { display:grid; place-items:center; }
.arr svg { width: 80px; }
.sync { margin-top: auto; display:flex; align-items:center; gap: 36px; font-size: 32px; color: var(--ink-2); }
.sync img { height: 190px; border-radius: 10px; box-shadow: 0 0 0 1px var(--line), 0 18px 30px -18px rgba(2,34,31,.4); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="SuDu AI" data-sparks="9,1 1,5" style="--gx:50%;--gy:55%;--mx:50%;--my:55%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">SQL Account 保存记录。 <span class="g">SuDu AI 负责干活。</span></h1>
<div class="flow">
<div class="glass c r" style="--d:.4s"><h3>SQL Account 掌握</h3><ul><li>客户</li><li>价格</li><li>信用额度</li><li>你的账</li></ul></div><div class="arr f" style="--d:.9s"><svg viewBox="0 0 80 20" fill="none"><path d="M2 10H74M66 3l8 7-8 7" stroke="rgba(2,34,31,.35)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle r="5" fill="#00A57A"><animateMotion dur="1.6s" repeatCount="indefinite" path="M2 10H70"/></circle></svg></div><div class="mid c r" style="--d:.6s"><h3>SuDu AI 负责</h3><ul><li>接订单</li><li>调动库存</li><li>管生产</li><li>收款</li></ul></div><div class="arr f" style="--d:1.1s"><svg viewBox="0 0 80 20" fill="none"><path d="M2 10H74M66 3l8 7-8 7" stroke="rgba(2,34,31,.35)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle r="5" fill="#00A57A"><animateMotion dur="1.6s" repeatCount="indefinite" path="M2 10H70"/></circle></svg></div><div class="glass c r" style="--d:.8s"><h3>回到 SQL Account</h3><ul><li>订单</li><li>Invoice</li><li>GRN</li><li>收据</li></ul></div>
</div>
<div class="sync r" style="--d:1.6s"><img src="../assets/shot-sqlsync.png" alt="SQL Sync Agent 设置画面">用 SuDu 自己的工具连接，有权限控制。</div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
