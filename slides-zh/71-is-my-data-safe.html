<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>我的数据安全吗？ · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.rows { flex:1; display:grid; align-content:center; gap: 26px; max-width: 1400px; }

.row svg { color: var(--green); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */

</head>
<body class="light" data-section="备用" data-sparks="9,1 1,5" style="--gx:75%;--gy:50%;--mx:75%;--my:50%">
<main class="slide">

  <div class="glass row r" style="--d:.6s"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span class="ph">[是否用来训练 AI]</span></div>
</div>
</main>
<script src="../shared/deck.js"></script>
