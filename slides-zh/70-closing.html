<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>结语 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.wrap { flex:1; display:grid; grid-template-columns: 1fr 520px; align-items:center; gap: 60px; }
.display { font-size: 118px; line-height: 1.02; }
.display .dim { color: var(--on-dark-3); }
.av { width: 500px; height: 500px; }
.logo { position:absolute; left: 128px; bottom: 64px; height: 40px; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="dark bare" data-section="备用" data-sparks="2,1 8,1 9,4 5,5" style="--gx:70%;--gy:50%;--mx:70%;--my:50%">
<main class="slide">
<div class="wrap">
  <h1 class="display"><span class="dim r" style="--d:.2s;display:block">你带着待办清单进来。</span><span class="r" style="--d:.9s;display:block">带着你的 <span class="sig" style="--sd:1.8s">第一个 AI 工作离开。</span></span></h1>
  <div class="float"><img class="av pop" style="--d:.5s" src="../assets/av/agent-liftoff.svg" alt="起飞的 AI Agent"></div>
</div>
<img class="logo f" style="--d:1.4s" src="../assets/logo-white.png" alt="SuDu AI">
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
