<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>看你的跑起来 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.rows { flex:1; display:grid; align-content:center; gap: 6px; margin-top: 30px; max-width: 1500px; }
.ln { display:grid; grid-template-columns: 260px 1fr; align-items:end; padding: 20px 0; }
.ln b { font-family: var(--mono); font-size: 28px; letter-spacing: .1em; color: var(--neon); font-weight: 600; }
.blank { height: 56px; border-bottom: 2px solid rgba(242,251,247,.25); display:flex; align-items:center; }
.caret { display:inline-block; width: 4px; height: 44px; background: var(--neon); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="dark" data-section="工作坊" data-sparks="9,1 1,5" style="--gx:80%;--gy:40%;--mx:80%;--my:40%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">现场设一个</h1>
<div class="rows"><div class="ln r" style="--d:0.40s"><b>何时</b><span class="blank"><i class="caret"></i></span></div><div class="ln r" style="--d:0.52s"><b>看什么</b><span class="blank"></span></div><div class="ln r" style="--d:0.64s"><b>做什么</b><span class="blank"></span></div><div class="ln r" style="--d:0.76s"><b>除非</b><span class="blank"></span></div><div class="ln r" style="--d:0.88s"><b>何时停</b><span class="blank"></span></div><div class="ln r" style="--d:1.00s"><b>通知谁</b><span class="blank"></span></div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
