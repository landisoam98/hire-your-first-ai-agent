<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>问题 2：日常工作 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.wrap { flex:1; display:grid; grid-template-columns: 1fr 760px; gap: 80px; align-items:center; }
.h1 { margin-top: 18px; }
.lead { margin-top: 24px; max-width: 760px; }
.loop { margin-top: 40px; display:inline-flex; align-items:center; gap: 14px; font-size: 30px; font-weight: 700; color: #B4451F; }
.loop svg { animation: spin 3s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.todo { padding: 30px 34px; border-radius: 28px; }
.todo h4 { font-family: var(--mono); font-size: 19px; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
.rw { display:grid; grid-template-columns: 44px 90px 1fr; align-items:center; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--line); }
.rw:last-child { border: 0; }
.rw b { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--green); }
.rw .job { font-size: 30px; }
.cb { width: 36px; height: 36px; border-radius: 9px; border: 3px solid var(--ink); display:grid; place-items:center; }
.cb i { opacity: 0; transform: scale(.4); animation: tick .35s var(--spring) forwards; animation-delay: var(--d); color: var(--green); display:grid; }
@keyframes tick { to { opacity: 1; transform: none; } }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="问题" data-sparks="9,1" style="--gx:80%;--gy:50%;--mx:80%;--my:50%">
<main class="slide">
<div class="prob f" style="--d:0s">问题 2/5<i><b></b><b class="on"></b><b></b><b></b><b></b></i><span>日常工作靠人做</span></div>
<div class="wrap">
  <div>
    <h1 class="h1 r" style="--d:.1s">同样的工作，每天靠人手做</h1>
    <p class="lead r" style="--d:.3s">你办公室里每天都有人在做这张清单。明天，又从头开始。</p>
    <div class="loop r" style="--d:4.3s"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>明天再来</div>
  </div>
  <div class="glass todo r" style="--d:.3s"><h4>今日例行工作</h4><div class="rw r" style="--d:0.50s"><span class="cb"><i style="--d:1.00s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></i></span><b>9:00</b><span class="job">查看谁逾期</span></div><div class="rw r" style="--d:0.62s"><span class="cb"><i style="--d:1.50s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></i></span><b>9:30</b><span class="job">WhatsApp 发 15 条付款提醒</span></div><div class="rw r" style="--d:0.74s"><span class="cb"><i style="--d:2.00s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></i></span><b>11:00</b><span class="job">把银行单据对上 Invoice</span></div><div class="rw r" style="--d:0.86s"><span class="cb"><i style="--d:2.50s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></i></span><b>2:00</b><span class="job">给客户发对账单</span></div><div class="rw r" style="--d:0.98s"><span class="cb"><i style="--d:3.00s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></i></span><b>4:30</b><span class="job">检查库存</span></div><div class="rw r" style="--d:1.10s"><span class="cb"><i style="--d:3.50s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></i></span><b>5:30</b><span class="job">整理销售报表</span></div></div>
</div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
