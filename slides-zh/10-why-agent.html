<style>

.mt { font-size: 66px; }

.lbs .p4, .lbs .p4 .ld { animation-delay: 1.50s; }
.lbs .p5, .lbs .p5 .ld { animation-delay: 1.70s; }

@keyframes lin { to { opacity: 1; } }

<body class="dark" data-section="什么是 AI Agent？" data-sparks="none" data-w="1">
<main class="slide">
<div class="why">
  <div class="mk" style="--d:.05s;opacity:1;transform:none">为什么需要 AI Agent</div>
  <h1 class="mt" style="--d:.15s">聊天机器人只会 <em>说</em>。你的生意需要的是把事 <em>做完</em>。</h1>
  <div class="q" style="--d:.35s"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></i>Ali bin Osman: 2 grade C egg, 2 grade B egg</div>
  <div class="cmp">
    <div class="bad" style="--d:.6s">
      <div class="pic"><img class="av" src="../assets/av/meiling-typing.svg" alt="Mei Ling 在打字">
        <div class="cb"><span>聊天机器人回复</span>打开 SQL Account，开 Sales Order，查库存，再回复……</div></div>
      <div class="cap"><small>聊天机器人</small><h3>告诉你怎么做</h3><p class="res">打字的还是你。</p></div>
    </div>
    <div class="ag" style="--d:.85s">
      <div class="pic"><div class="shot"><img src="../assets/shot-approve.png" alt="SuDu 批准卡：Ali 的 Sales Order，等你批准"></div>
        <img class="av2" src="../assets/av/agent-thumbs.svg" alt="SuDu AI Agent"><span class="tg"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>Sales Order 已拟好</span></div>
      <div class="cap"><small>AI AGENT</small><h3>帮你做完</h3><p class="res">你只需要批准。</p></div>
    </div>
  </div>
  <p class="bt" style="--d:1.2s">它不会点击、会忘记、不懂你的规矩，也没有人管着它。 <b>所以我们给大脑 4 样东西。</b></p>
</div>
