<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>配套与价格 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 44px; font-size: 30px; table-layout: fixed; }
th:nth-child(1) { width: 420px; } th:nth-child(2) { width: 210px; } th:nth-child(3) { width: 240px; }
th { white-space: nowrap; }
th { font-family: var(--mono); font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); text-align:left; font-weight: 600; padding: 0 28px 16px; border-bottom: 2px solid var(--ink); }
td { padding: 19px 28px; border-bottom: 1px solid var(--line); color: var(--ink-2); }
td:nth-child(2), td:nth-child(3) { font-feature-settings: "tnum"; color: var(--ink); white-space: nowrap; }
td b { color: var(--ink); font-weight: 650; }
tr.on td { background: var(--ink); color: var(--on-dark-2); border-color: var(--ink); }
tr.on td b, tr.on td:nth-child(2), tr.on td:nth-child(3) { color: var(--on-dark); }
tr.on td:first-child { border-radius: 18px 0 0 18px; } tr.on td:last-child { border-radius: 0 18px 18px 0; }
.tag { white-space: nowrap; font-size: 18px; font-family: var(--mono); letter-spacing: .06em; color: var(--ink); background: var(--neon); padding: 5px 10px; border-radius: 8px; margin-left: 12px; vertical-align: 3px; font-weight: 600; }
.note { font-size: 26px; color: var(--ink-3); margin-top: 26px; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="诊断" data-sparks="9,1" style="--gx:85%;--gy:20%;--mx:85%;--my:20%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">配套</h1>
<table><tr class="f" style="--d:.2s"><th>计划</th><th>每月</th><th>安装费，1 次</th><th>AI Agent 会…</th></tr><tr class=" r" style="--d:0.35s"><td><b>Lite</b></td><td>RM599</td><td>RM5,999</td><td>在 WhatsApp 发文件和通知</td></tr><tr class=" r" style="--d:0.45s"><td><b>Basic</b></td><td>RM850</td><td>RM9,500</td><td>跑每日工作：追款、早上检查</td></tr><tr class="on r" style="--d:0.55s"><td><b>Standard</b> <span class="tag">多数从这里开始</span></td><td>RM1,200</td><td>RM12,000</td><td>在 WhatsApp 接客户订单</td></tr><tr class=" r" style="--d:0.65s"><td><b>Pro</b></td><td>RM2,000</td><td>RM19,000</td><td>集团多公司，更多仓库工作</td></tr><tr class=" r" style="--d:0.75s"><td><b>Max</b></td><td>RM3,500</td><td>RM35,000</td><td>全部功能，加专属 SuDu 联系人</td></tr></table>
<p class="note f" style="--d:1.1s">按年收费。多数公司从 Standard 开始。</p>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
