<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>现场演示 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
body { background: #FBFAF6; }
.bg { display: none; }
.slide { padding-top: 100px; }
.kicker { font-size: 22px; letter-spacing: .2em; color: var(--green); }
.h1 { font-size: 80px; margin-top: 14px; }
.lead { font-size: 31px; margin-top: 14px; max-width: 1300px; color: var(--ink-2); }
.row { display:grid; grid-template-columns: repeat(6, 1fr); gap: 20px; margin-top: 60px; }
.tm { border-radius: 26px; padding: 30px 18px 28px; background: #fff; text-align:center; display:flex; flex-direction:column; align-items:center;
  box-shadow: 0 0 0 1px rgba(2,34,31,.06), 0 24px 44px -30px rgba(2,34,31,.35); }
.tm .ph { width: 190px; height: 190px; border-radius: 50%; background: #fff; display:grid; place-items:center; box-shadow: 0 0 0 1px rgba(2,34,31,.08); }
.tm .av { width: 180px; height: 180px; box-shadow: none; }
.tm b { font-size: 40px; font-weight: 700; letter-spacing: -.02em; margin-top: 22px; color: var(--ink); }
.tm .ag { font-size: 25px; color: var(--ink-3); margin-top: 6px; }
.tm p { font-size: 24px; line-height: 1.3; color: var(--green); font-weight: 600; margin-top: 14px; }
.foot { margin-top: auto; font-size: 22px; color: var(--ink-3); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="SuDu AI" data-sparks="none" style="--gx:50%;--gy:40%">
<main class="slide">
<div class="kicker r" style="--d:.05s">现场演示 · 认识 AI 团队</div><h1 class="h1 r" style="--d:.15s">今天 demo 的 6 个 AI Agent</h1><p class="lead r" style="--d:.3s">一家用 SQL Account 的示范食品批发商，已接上 SuDu AI。每个 AI Agent 各管一件事。</p><div class="row"><div class="tm r" style="--d:0.45s"><div class="ph"><img class="av" src="../assets/av/team-sasha.svg" alt=""></div><b>Sasha</b><span class="ag">Sales AI</span><p>接 WhatsApp、PDF 和聊天里的订单</p></div><div class="tm r" style="--d:0.55s"><div class="ph"><img class="av" src="../assets/av/team-ivan.svg" alt=""></div><b>Ivan</b><span class="ag">Inventory AI</span><p>查库存，发库存报告</p></div><div class="tm r" style="--d:0.65s"><div class="ph"><img class="av" src="../assets/av/team-puteri.svg" alt=""></div><b>Puteri</b><span class="ag">Purchase AI</span><p>开 PO，记录供应商 Invoice</p></div><div class="tm r" style="--d:0.75s"><div class="ph"><img class="av" src="../assets/av/team-cody.svg" alt=""></div><b>Cody</b><span class="ag">Collection AI</span><p>追逾期款，看银行转账单</p></div><div class="tm r" style="--d:0.85s"><div class="ph"><img class="av" src="../assets/av/team-uma.svg" alt=""></div><b>Uma</b><span class="ag">Up Sales AI</span><p>把流失的顾客拉回来</p></div><div class="tm r" style="--d:0.95s"><div class="ph"><img class="av" src="../assets/av/team-felix.svg" alt=""></div><b>Felix</b><span class="ag">Finance AI</span><p>解释数字，做 Dashboard</p></div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
