<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>AI 绝不做的 4 件事 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.wrap { flex:1; display:grid; grid-template-columns: 1fr 700px; gap: 80px; align-items:center; }
ol { list-style:none; display:grid; gap: 30px; margin-top: 50px; counter-reset: n; }
li { display:grid; grid-template-columns: 70px 1fr; font-size: 42px; line-height: 1.2; font-weight: 550; letter-spacing: -.015em; counter-increment: n; }
li::before { content: counter(n); font-family: var(--mono); font-size: 28px; color: var(--green); padding-top: 8px; }
.shot { position:relative; }
.shot img { width: 640px; border-radius: 26px; box-shadow: 0 0 0 1px var(--line), 0 60px 100px -50px rgba(2,34,31,.55); transform: rotate(2deg); }
.shot .cap { position:absolute; left: -40px; bottom: 60px; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="SuDu AI" data-sparks="1,1 6,5" style="--gx:75%;--gy:50%;--mx:75%;--my:50%">
<main class="slide">
<div class="wrap">
  <div>
    <h1 class="h1 r" style="--d:.1s">没有你，它绝不做的 4 件事</h1>
    <ol>
      <li class="r" style="--d:.5s">你没批准，什么都不会存进去。</li>
      <li class="r" style="--d:.7s">它绝不动钱。</li>
      <li class="r" style="--d:.9s">它只读你开启的 WhatsApp 群组。</li>
      <li class="r" style="--d:1.1s">它做的每件事都有记录，你随时可看。</li>
    </ol>
  </div>
  <div class="shot r" style="--d:.6s"><img src="../assets/shot-approve.png" alt="批准卡：建立 Sales Order，等你批准"><span class="pill cap pop" style="--d:1.6s"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg> 等你批准</span></div>
</div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
