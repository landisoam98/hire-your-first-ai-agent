<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>你的分数代表什么 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.cols { flex:1; display:grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 54px; }
.c { padding: 44px 44px; display:flex; flex-direction:column; }
.c svg { width: 230px; height: 200px; color: var(--ink); margin-left: -18px; }
.sc { font-family: var(--mono); font-size: 64px; font-weight: 600; letter-spacing: -.03em; margin-top: 34px; }
.c h3 { font-size: 40px; font-weight: 650; letter-spacing: -.02em; margin-top: 10px; }
.c p { font-size: 30px; line-height: 1.38; color: var(--ink-2); margin-top: 16px; }
.c.on { background: var(--ink); color: var(--on-dark); border-radius: 30px; box-shadow: 0 0 90px rgba(0,245,169,.22); }
.c.on svg { color: var(--on-dark); } .c.on p { color: var(--on-dark-2); } .c.on .sc { color: var(--neon); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="工作坊" data-sparks="9,1 1,5" style="--gx:50%;--gy:55%;--mx:50%;--my:55%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">从哪里开始</h1>
<div class="cols">
  <div class="glass c r" style="--d:.3s"><svg viewBox="0 0 120 104" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 86h104v12H8z" fill="#00F5A9" fill-opacity=".35"/><path d="M8 86h104v12H8z"/><path d="M20 86V50h80v36" stroke-dasharray="3 7" opacity=".35"/><path d="M12 52L60 18l48 34" stroke-dasharray="3 7" opacity=".35"/></svg><div class="sc">0 到 3</div><h3>先打地基。</h3><p>先整理货品编号和库存。</p></div>
  <div class="c on r" style="--d:.5s"><svg viewBox="0 0 120 104" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 86h104v12H8z" fill="#00F5A9" fill-opacity=".35"/><path d="M8 86h104v12H8z"/><path d="M20 86V50h80v36M52 86V64h16v22"/><path d="M12 52L60 18l48 34" stroke-dasharray="3 7" opacity=".35"/></svg><div class="sc">4 到 6</div><h3>1 个 AI 工作。</h3><p>用你的 SQL Account 数据，先做 1 个工作。</p></div>
  <div class="glass c r" style="--d:.7s"><svg viewBox="0 0 120 104" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 86h104v12H8z" fill="#00F5A9" fill-opacity=".35"/><path d="M8 86h104v12H8z"/><path d="M20 86V50h80v36M52 86V64h16v22"/><path d="M12 52L60 18l48 34" stroke-width="5"/><circle cx="60" cy="12" r="7" fill="#00F5A9" stroke="none"/></svg><div class="sc">7 到 8</div><h3>整栋房子。</h3><p>你已准备好用整套系统。</p></div>
</div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
