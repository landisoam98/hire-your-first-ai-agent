<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>30 天上线 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.tl { position:relative; display:grid; grid-template-columns: repeat(5, 1fr); gap: 24px; margin-top: auto; }
.tl svg { position:absolute; left: 0; top: 0; width: 100%; height: 22px; overflow:visible; }
.s i { display:block; width: 26px; height: 26px; border-radius: 50%; background: var(--paper); border: 5px solid var(--ink); position:relative; z-index:1; }
.s:nth-child(4) i { background: var(--neon); border-color: var(--ink); box-shadow: 0 0 0 10px rgba(0,245,169,.2); }
.w { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--green); margin-top: 30px; }
.t { font-size: 32px; line-height: 1.35; color: var(--ink-2); margin-top: 12px; padding-right: 20px; }
.t b { color: var(--ink); font-weight: 650; }
.need { margin-top: auto; display:flex; align-items:center; gap: 22px; flex-wrap: wrap; font-size: 32px; font-weight: 600; }
.need span { font-weight: 500; font-size: 30px; padding: 14px 26px; border-radius: 999px; background:#fff; box-shadow: 0 0 0 1px var(--line); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="诊断" data-sparks="9,1 1,5" style="--gx:50%;--gy:45%;--mx:50%;--my:45%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">第 1 周就开工，30 天完成</h1>
<div class="tl">
  <svg viewBox="0 0 1664 22" preserveAspectRatio="none"><path class="draw" pathLength="1" style="--d:.4s;--dur:2.4s" d="M13 13 H1363" stroke="#02221F" stroke-width="4"/></svg>
  <div class="s pop" style="--d:0.60s"><i></i><div class="w">第 0 天</div><div class="t"><b>开始：</b> 选定你的第一个工作。</div></div><div class="s pop" style="--d:1.00s"><i></i><div class="w">第 1 到 3 天</div><div class="t"><b>设置：</b> 导入数据，连上 SQL Account。</div></div><div class="s pop" style="--d:1.40s"><i></i><div class="w">第 1 周</div><div class="t"><b>上线：</b> 第一个工作开始运行。</div></div><div class="s pop" style="--d:1.80s"><i></i><div class="w">第 2 到 3 周</div><div class="t"><b>扩展：</b> 加入更多工作。</div></div><div class="s pop" style="--d:2.20s"><i></i><div class="w">第 4 周</div><div class="t"><b>运行：</b> 它自己运行。</div></div>
</div>
<div class="need r" style="--d:2.8s">我们需要你提供 3 样： <span>你的数据</span><span>1 位批准人</span><span>1 位日常使用者</span></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
