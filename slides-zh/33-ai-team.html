<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>AI 团队 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.team { display:flex; flex-wrap:wrap; gap: 24px; justify-content:center; margin-top: 36px; }
.m { width: 396px; padding: 30px 34px 32px; display:flex; flex-direction:column; align-items:flex-start; }
.m .av { width: 128px; height: 128px; margin-bottom: 22px; }
.m b { font-size: 36px; font-weight: 650; letter-spacing: -.015em; white-space: nowrap; }
.m span { font-size: 28px; color: var(--ink-2); line-height: 1.25; margin-top: 4px; }
.end { margin-top: auto; text-align:center; font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
.end span { color: var(--ink-3); font-weight: 500; }
.end span:lang(en) { margin-left: .28em; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="SuDu AI" data-sparks="9,1 1,5" style="--gx:50%;--gy:60%;--mx:50%;--my:60%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">7 个 AI Agent，各管 1 件事</h1>
<div class="team"><div class="glass m pop" style="--d:0.35s"><img class="av" src="../assets/av/agent-typing.svg" alt=""><b>Sales AI</b><span>接订单</span></div><div class="glass m pop" style="--d:0.47s"><img class="av" src="../assets/av/av-agent-clip.png" alt=""><b>Purchase AI</b><span>采购进货</span></div><div class="glass m pop" style="--d:0.59s"><img class="av" src="../assets/av/agent-bullseye.svg" alt=""><b>Inventory AI</b><span>看库存</span></div><div class="glass m pop" style="--d:0.71s"><img class="av" src="../assets/av/agent-payday.svg" alt=""><b>Collection AI</b><span>收款</span></div><div class="glass m pop" style="--d:0.83s"><img class="av" src="../assets/av/av-agent-invoice.png" alt=""><b>Payment AI</b><span>付款给供应商</span></div><div class="glass m pop" style="--d:0.95s"><img class="av" src="../assets/av/av-agent-mega.png" alt=""><b>Up Sales AI</b><span>把顾客拉回来</span></div><div class="glass m pop" style="--d:1.07s"><img class="av" src="../assets/av/av-agent-chart.png" alt=""><b>Finance AI</b><span>盯数字</span></div></div>
<p class="end r" style="--d:1.4s">一般情况 AI 处理，<span>特别情况交给人做决定。</span></p>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
