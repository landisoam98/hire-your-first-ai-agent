<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>5 大问题 · 聘请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.slide { padding-top: 90px; }
.h1 { font-size: 72px; }
.list { flex:1; display:grid; grid-template-rows: repeat(5, 1fr); gap: 14px; margin-top: 34px; }
.iss { display:grid; grid-template-columns: 90px 84px 1fr auto; align-items:center; gap: 26px; padding: 0 34px 0 22px; border-radius: 24px; background: #fff;
  box-shadow: 0 0 0 1px var(--line), 0 24px 40px -30px rgba(2,34,31,.35); }
.iss .no { font-size: 72px; font-weight: 700; letter-spacing: -.04em; color: var(--green); text-align:center; line-height: 1; }
.iss .ic { width: 72px; height: 72px; border-radius: 20px; background: var(--ink); color: var(--neon); display:grid; place-items:center; }
.iss .ic svg { width: 40px; height: 40px; }
.iss h3 { font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
.iss p { font-size: 26px; color: var(--ink-2); margin-top: 4px; }
.iss .tg { font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .1em; color: #B4451F; background: rgba(255,138,91,.14); padding: 8px 14px; border-radius: 10px; }
.iss:first-child { background: var(--ink); }
.iss:first-child .no { color: var(--neon); }
.iss:first-child .ic { background: var(--neon); color: var(--ink); }
.iss:first-child h3 { color: var(--on-dark); }
.iss:first-child p { color: var(--on-dark-2); }
.iss:first-child .tg { color: #FFB08F; background: rgba(255,138,91,.16); }
h1 .sig:lang(en) { margin-left: .26em; }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="问题" data-sparks="9,0" style="--gx:85%;--gy:15%;--mx:85%;--my:20%">
<main class="slide">
<h1 class="h1 r" style="--d:.1s">这 5 个问题，<span class="sig" style="--sd:1.4s">每个企业都有</span></h1>
<div class="list"><div class="iss r" style="--d:0.35s"><span class="no">1</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg></span><div class="tx"><h3>订单靠人手输入</h3><p>每张 WhatsApp 和 Email 订单都要重打一次，要一整组人来做。</p></div><span class="tg">人力</span></div><div class="iss r" style="--d:0.57s"><span class="no">2</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></span><div class="tx"><h3>日常工作靠人做</h3><p>追逾期款、发对账单、每天检查。</p></div><span class="tg">每天</span></div><div class="iss r" style="--d:0.79s"><span class="no">3</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg></span><div class="tx"><h3>问题发现得太迟</h3><p>销量下跌、顾客流失、库存断货，没人及时发现。</p></div><span class="tg">太迟</span></div><div class="iss r" style="--d:1.01s"><span class="no">4</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg></span><div class="tx"><h3>库存永远不准</h3><p>系统写 40 箱，货架上只有 12 箱。</p></div><span class="tg">没人信</span></div><div class="iss r" style="--d:1.23s"><span class="no">5</span><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h4"/></svg></span><div class="tx"><h3>钱收得慢</h3><p>送货几天后才发 Invoice，银行单据在聊天里找不到。</p></div><span class="tg">现金流</span></div></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
