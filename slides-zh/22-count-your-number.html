<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>算出你自己的数字 · 请你的第一个 AI Agent</title>
<link rel="stylesheet" href="../shared/deck.css">
<style>
.slide { padding-top: 90px; }
.h1 { font-size: 70px; }
.lead { margin-top: 10px; font-size: 30px; }
.calc { flex:1; display:grid; grid-template-columns: 1.25fr 70px 1fr 70px 1fr 70px 1.35fr; align-items:stretch; margin-top: 40px; }
.op { display:grid; place-items:center; font-size: 64px; font-weight: 700; color: var(--ink-3); }
.st { padding: 26px 26px 24px; border-radius: 26px; display:flex; flex-direction:column; }
.st .k { font-family: var(--mono); font-size: 18px; font-weight: 700; letter-spacing: .12em; color: var(--green); }
.st h3 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; margin-top: 8px; line-height: 1.15; }
.st .hint { font-size: 22px; color: var(--ink-3); margin-top: 6px; line-height: 1.3; }
.st .v { margin-top: auto; font-size: 62px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.st .v small { font-size: 26px; font-weight: 600; color: var(--ink-3); margin-left: 6px; letter-spacing: 0; }
.jobs { margin: 14px 0 16px; display:grid; gap: 8px; }
.jobs div { display:flex; justify-content:space-between; font-size: 24px; padding: 8px 12px; border-radius: 10px; background: var(--mint); }
.jobs b { font-weight: 700; }
.res { background: var(--ink); color: var(--on-dark); box-shadow: 0 0 80px rgba(0,245,169,.25); }
.res .k { color: var(--neon); } .res .hint { color: var(--on-dark-2); }
.res .v { color: var(--neon); font-size: 76px; }
.res .v small { color: var(--on-dark-2); }
.res .v small.yr { display:block; margin: 10px 0 0; font-size: 30px; }
.foot2 { display:flex; align-items:center; gap: 24px; margin-top: 26px; font-size: 26px; color: var(--ink-2); }
</style>
<style>:root{--sans:"Figtree","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;--mono:"JetBrains Mono","PingFang SC","Noto Sans SC","Microsoft YaHei",monospace}html[lang=zh-Hans] body{word-break:normal;line-break:strict}</style><style>/* Chinese-only tweaks */
h1.display { font-size: 126px; }
</style>
</head>
<body class="light" data-section="问题" data-sparks="9,0" style="--gx:78%;--gy:70%;--mx:70%;--my:70%">
<main class="slide">
<h1 class="h1 r" style="--d:.05s">人手工作一年花掉你多少钱？</h1>
<p class="lead r" style="--d:.2s">3 个步骤。先看例子，再算你的。</p>
<div class="calc">
  <div class="glass st r" style="--d:.4s"><span class="k">第 1 步</span><h3>每周人手工作的时数</h3><span class="hint">所有员工加起来</span>
    <div class="jobs"><div><span>输入订单</span><b>10 h</b></div><div><span>追收款</span><b>8 h</b></div><div><span>查库存</span><b>7 h</b></div></div>
    <div class="v">25<small>小时</small></div></div>
  <span class="op f" style="--d:.8s">&times;</span>
  <div class="glass st r" style="--d:.9s"><span class="k">第 2 步</span><h3>一年的周数</h3><span class="hint">每周，全年</span><div class="v">52<small>周</small></div></div>
  <span class="op f" style="--d:1.2s">&times;</span>
  <div class="glass st r" style="--d:1.3s"><span class="k">第 3 步</span><h3>文员 1 小时的成本</h3><span class="hint">薪水加 EPF 和 SOCSO</span><div class="v">RM16</div></div>
  <span class="op f" style="--d:1.6s">=</span>
  <div class="st res r" style="--d:1.7s"><span class="k">你的数字</span><h3>花在打单和追款的钱</h3><span class="hint">25 &times; 52 &times; RM16</span>
    <div class="v">RM<span data-count="20800" data-delay="2" data-dur="1.6">0</span><small class="yr">一年</small></div></div>
</div>
<div class="foot2 r" style="--d:2.4s"><div class="ws" style="--d:2.4s"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg><b>第 1 格</b>写下你自己的数字，大概就好。</div><span>1 分钟。没人会念出来。</span></div>
</main>
<script src="../shared/deck.js"></script>
</body>
</html>
